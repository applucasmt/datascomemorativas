<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DATAS COMEMORATIVAS</title>
    
    <meta name="theme-color" content="#f2f2f7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Agenda">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        :root {
            --bg: #f2f2f7;
            --surface: #ffffff;
            --surface-elevated: #ffffff;
            --text: #1a1a1a;
            --text-2: #8e8e93;
            --text-3: #c7c7cc;
            --blue: #007AFF;
            --green: #34C759;
            --orange: #FF9500;
            --red: #FF3B30;
            --purple: #AF52DE;
            --border: rgba(0, 0, 0, 0.06);
            --surface-2: rgba(118, 118, 128, 0.06);
            --surface-3: rgba(118, 118, 128, 0.12);
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.04);
        }

        body.dark {
            --bg: #000000;
            --surface: #1c1c1e;
            --surface-elevated: #2c2c2e;
            --text: #f2f2f7;
            --text-2: #a1a1a6;
            --text-3: #48484a;
            --blue: #0A84FF;
            --green: #30D158;
            --orange: #FF9F0A;
            --red: #FF453A;
            --purple: #BF5AF2;
            --border: rgba(255, 255, 255, 0.1);
            --surface-2: rgba(118, 118, 128, 0.15);
            --surface-3: rgba(118, 118, 128, 0.25);
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
            background-color: var(--bg);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            color: var(--text);
            transition: background-color 0.3s ease, color 0.3s ease;
            padding: 0;
            margin: 0;
        }

        #app {
            height: 100vh;
            overflow: hidden;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.3); border-radius: 10px; }

        /* ============================================
           APP CONTAINER
        ============================================ */
        .app-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 8px 12px 12px 12px;
            background: var(--bg);
            max-width: 1400px;
            margin: 0 auto;
            overflow: hidden;
            transition: background-color 0.3s ease;
        }

        @media (max-width: 768px) {
            .app-container { padding: 6px 10px 10px 10px; }
        }

        @media (max-width: 480px) {
            .app-container { padding: 4px 6px 6px 6px; }
        }

        /* ============================================
           HEADER
        ============================================ */
        .ios-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 4px 8px 4px;
            flex-shrink: 0;
            gap: 8px;
        }

        .header-title-wrap {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .ios-header h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--text) 0%, var(--text-2) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
        }

        @media (max-width: 768px) {
            .ios-header h1 { font-size: 24px; }
        }

        @media (max-width: 480px) {
            .ios-header h1 { font-size: 20px; }
        }

        .header-subtitle {
            font-size: 12px;
            color: var(--text-2);
            font-weight: 500;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .header-subtitle .pulse-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--orange);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
        }

        .ios-header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .ios-header-actions .ios-btn-icon svg {
            width: 18px;
            height: 18px;
        }

        .ios-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
            margin-right: 4px;
        }

        .ios-status-dot.online { background: var(--green); box-shadow: 0 0 0 3px rgba(52,199,89,0.15); }
        .ios-status-dot.syncing { background: var(--orange); animation: pulse 1s infinite; }
        .ios-status-dot.offline { background: var(--text-2); }

        .ios-btn-icon {
            background: var(--surface-3);
            border: none;
            border-radius: 10px;
            padding: 8px 10px;
            font-size: 13px;
            font-weight: 600;
            color: var(--blue);
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: inherit;
        }

        .ios-btn-icon:active {
            transform: scale(0.92);
            background: var(--surface-2);
        }

        .ios-btn-icon:disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .ios-btn-icon.primary {
            background: var(--blue);
            color: white;
        }

        .ios-btn-icon.primary:active {
            background: #0066d9;
        }

        @media (max-width: 480px) {
            .ios-btn-icon { padding: 6px 8px; }
            .ios-btn-icon .btn-text { display: none; }
        }

        /* ============================================
           PROGRESS BAR GLOBAL
        ============================================ */
        .global-progress {
            background: var(--surface);
            border-radius: 12px;
            padding: 10px 14px;
            margin: 0 4px 10px 4px;
            border: 0.5px solid var(--border);
            box-shadow: var(--shadow);
            flex-shrink: 0;
            transition: background 0.3s ease;
        }

        .global-progress-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
            gap: 8px;
        }

        .global-progress-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .global-progress-pct {
            font-size: 13px;
            font-weight: 700;
            color: var(--green);
        }

        .global-progress-track {
            height: 6px;
            background: var(--surface-3);
            border-radius: 3px;
            overflow: hidden;
        }

        .global-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--blue), var(--green));
            border-radius: 3px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (max-width: 480px) {
            .global-progress { padding: 8px 10px; margin-bottom: 8px; }
            .global-progress-label { font-size: 11px; }
        }

        /* ============================================
           SEGMENTED CONTROL
        ============================================ */
        .ios-segmented {
            background: var(--surface-3);
            border-radius: 10px;
            padding: 4px;
            display: flex;
            flex-shrink: 0;
            margin-bottom: 8px;
            margin-left: 4px;
            margin-right: 4px;
            border: 1px solid var(--border);
            gap: 2px;
        }

        .ios-segment {
            flex: 1;
            padding: 8px 4px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-2);
            border-radius: 8px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: none;
            background: transparent;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            min-width: 0;
        }

        .ios-segment.active {
            background: var(--surface-elevated);
            color: var(--blue);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
        }

        .ios-segment:active {
            transform: scale(0.96);
        }

        .ios-segment .badge {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 8px;
            font-weight: 700;
            background: var(--surface-2);
            color: var(--text-2);
            min-width: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .ios-segment.active .badge {
            background: rgba(0, 122, 255, 0.12);
            color: var(--blue);
        }

        .ios-segment .badge.pending {
            background: rgba(255, 149, 0, 0.15);
            color: var(--orange);
        }

        @media (max-width: 480px) {
            .ios-segment { font-size: 12px; padding: 6px 2px; gap: 3px; }
            .ios-segment .badge { font-size: 9px; padding: 0 4px; }
            .ios-segment .label-full { display: none; }
        }

        /* ============================================
           FILTER ROW
        ============================================ */
        .filter-row {
            display: flex;
            gap: 6px;
            margin: 0 4px 10px 4px;
            flex-shrink: 0;
        }

        .filter-chip {
            flex: 1;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1.5px solid var(--border);
            background: var(--surface);
            color: var(--text-2);
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .filter-chip:active {
            transform: scale(0.97);
        }

        .filter-chip.active {
            background: var(--blue);
            border-color: var(--blue);
            color: white;
        }

        .filter-chip.active.pending {
            background: var(--orange);
            border-color: var(--orange);
        }

        .filter-chip.active.done {
            background: var(--green);
            border-color: var(--green);
        }

        .filter-chip .chip-count {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 8px;
            background: var(--surface-3);
            color: inherit;
            opacity: 0.85;
        }

        .filter-chip.active .chip-count {
            background: rgba(255,255,255,0.25);
            color: white;
        }

        @media (max-width: 480px) {
            .filter-chip { font-size: 11px; padding: 6px 4px; }
        }

        /* ============================================
           GRID
        ============================================ */
        .ios-grid {
            flex: 1;
            display: flex;
            gap: 12px;
            min-height: 0;
            overflow: hidden;
        }

        @media (max-width: 1024px) {
            .ios-grid { 
                flex-direction: column; 
                gap: 10px;
                overflow: hidden;
            }
        }

        /* ============================================
           CALENDAR
        ============================================ */
        .ios-calendar {
            flex: 0 0 auto;
            width: 42%;
            min-width: 0;
            background: var(--surface);
            border-radius: 16px;
            border: 0.5px solid var(--border);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
            max-height: 100%;
            transition: background 0.3s ease;
        }

        @media (max-width: 1200px) {
            .ios-calendar { width: 45%; }
        }

        @media (max-width: 1024px) {
            .ios-calendar {
                width: 100%;
                flex: 0 0 auto;
                max-height: 360px;
                min-height: 260px;
            }
        }

        @media (max-width: 768px) {
            .ios-calendar {
                max-height: 320px;
                min-height: 240px;
            }
        }

        @media (max-width: 480px) {
            .ios-calendar {
                max-height: 280px;
                min-height: 200px;
            }
        }

        .ios-calendar .month-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px 6px 14px;
            flex-shrink: 0;
        }

        .ios-calendar .month-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
        }

        @media (max-width: 480px) {
            .ios-calendar .month-title { font-size: 15px; }
        }

        .ios-calendar .nav-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--blue);
            transition: all 0.2s;
            font-size: 18px;
        }

        .ios-calendar .nav-btn:active {
            background: rgba(0, 122, 255, 0.1);
            transform: scale(0.9);
        }

        .ios-calendar .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            padding: 0 8px 2px 8px;
            flex-shrink: 0;
        }

        .ios-calendar .weekday {
            text-align: center;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-2);
            padding: 4px 0;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        @media (max-width: 480px) {
            .ios-calendar .weekday { font-size: 9px; padding: 2px 0; }
        }

        @media (max-width: 380px) {
            .ios-calendar .weekday { font-size: 8px; padding: 1px 0; }
        }

        .ios-calendar .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            padding: 2px 8px 6px 8px;
            gap: 2px;
            flex: 1;
            align-content: start;
        }

        .ios-calendar .day-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
            font-weight: 500;
            font-size: 15px;
            color: var(--text);
            min-height: 36px;
            -webkit-tap-highlight-color: transparent;
        }

        .ios-calendar .day-cell:active {
            transform: scale(0.88);
        }

        .ios-calendar .day-cell.today {
            background: var(--blue);
            color: white;
            font-weight: 700;
        }

        .ios-calendar .day-cell.other-month {
            color: var(--text-3);
        }

        .ios-calendar .day-cell.weekend {
            color: var(--red);
        }

        .ios-calendar .day-cell.weekend.today {
            color: white;
        }

        .ios-calendar .day-cell.filtered-out {
            opacity: 0.35;
            filter: grayscale(100%);
        }

        /* Ring status */
        .ios-calendar .day-cell.pending-ring::before {
            content: '';
            position: absolute;
            inset: 1px;
            border-radius: 50%;
            border: 2px solid var(--orange);
            pointer-events: none;
        }

        .ios-calendar .day-cell.done-ring::before {
            content: '';
            position: absolute;
            inset: 1px;
            border-radius: 50%;
            border: 2px solid var(--green);
            pointer-events: none;
        }

        .ios-calendar .day-cell.today.pending-ring::before,
        .ios-calendar .day-cell.today.done-ring::before {
            border-color: rgba(255,255,255,0.7);
        }

        .ios-calendar .day-cell.has-event::after {
            content: '';
            position: absolute;
            bottom: 2px;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--blue);
        }

        .ios-calendar .day-cell.has-event.today::after {
            background: white;
        }

        .ios-calendar .day-cell.has-event-completed::after {
            background: var(--green);
        }

        .ios-calendar .day-cell.selected {
            background: rgba(0, 122, 255, 0.15);
            font-weight: 700;
        }

        .ios-calendar .day-cell.selected.today {
            background: var(--blue);
            color: white;
        }

        .ios-calendar .day-cell .event-indicator {
            display: flex;
            gap: 1px;
            margin-top: 1px;
        }

        .ios-calendar .day-cell .event-dot {
            width: 3px;
            height: 3px;
            border-radius: 50%;
        }

        .event-dot.cidades { background: var(--blue); }
        .event-dot.aniversariantes { background: var(--orange); }
        .event-dot.datas { background: var(--purple); }

        @media (max-width: 1024px) {
            .ios-calendar .day-cell { font-size: 14px; min-height: 34px; }
        }

        @media (max-width: 768px) {
            .ios-calendar .day-cell { font-size: 13px; min-height: 32px; }
        }

        @media (max-width: 480px) {
            .ios-calendar .day-cell { font-size: 12px; min-height: 28px; }
        }

        @media (max-width: 380px) {
            .ios-calendar .day-cell { font-size: 10px; min-height: 22px; }
        }

        .ios-calendar .legend {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 6px 0;
            border-top: 0.5px solid var(--border);
            font-size: 9px;
            color: var(--text-2);
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .ios-calendar .legend span {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .ios-calendar .legend .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }

        .ios-calendar .legend .dot.blue { background: var(--blue); }
        .ios-calendar .legend .dot.orange { background: var(--orange); }
        .ios-calendar .legend .dot.purple { background: var(--purple); }
        .ios-calendar .legend .dot.green { background: var(--green); }

        /* Next event */
        .next-event-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 6px 10px;
            border-top: 0.5px solid var(--border);
            font-size: 11px;
            font-weight: 600;
            color: var(--text);
            flex-shrink: 0;
            background: var(--surface-2);
        }

        .next-event-bar .label { color: var(--text-2); font-weight: 500; }
        .next-event-bar .time { color: var(--blue); }

        .ios-calendar .totals {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 5px 0;
            border-top: 0.5px solid var(--border);
            font-size: 10px;
            color: var(--text-2);
            flex-shrink: 0;
        }

        @media (max-width: 480px) {
            .ios-calendar .legend { font-size: 8px; gap: 6px; padding: 3px 0; }
            .ios-calendar .legend .dot { width: 4px; height: 4px; }
            .ios-calendar .totals { font-size: 9px; gap: 8px; padding: 3px 0; }
            .next-event-bar { font-size: 10px; padding: 4px 6px; }
        }

        /* ============================================
           EVENTS
        ============================================ */
        .ios-events {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border-radius: 16px;
            border: 0.5px solid var(--border);
            box-shadow: var(--shadow);
            overflow: hidden;
            height: 100%;
            transition: background 0.3s ease;
        }

        @media (max-width: 1024px) {
            .ios-events {
                flex: 1;
                min-height: 150px;
                max-height: 100%;
            }
        }

        @media (max-width: 480px) {
            .ios-events { min-height: 120px; }
        }

        .ios-events-header {
            padding: 12px 16px 8px 16px;
            border-bottom: 0.5px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            gap: 8px;
        }

        .ios-events-header h3 {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }

        .ios-events-header .date-chip {
            font-weight: 400;
            color: var(--text-2);
            font-size: 13px;
        }

        .ios-events-header .count {
            font-size: 12px;
            color: var(--text-2);
            background: var(--surface-3);
            padding: 3px 12px;
            border-radius: 12px;
            flex-shrink: 0;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .ios-events-header { padding: 8px 12px 6px 12px; }
            .ios-events-header h3 { font-size: 14px; }
        }

        .ios-events-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px 12px 12px;
            -webkit-overflow-scrolling: touch;
        }

        @media (max-width: 480px) {
            .ios-events-list { padding: 6px 8px 10px 8px; }
        }

        .category-group {
            margin-bottom: 12px;
        }

        .category-group-header {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            font-weight: 700;
            color: var(--text-2);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 4px 4px 6px 4px;
        }

        .category-group-header .icon { font-size: 11px; }

        .ios-event-item {
            background: var(--surface-2);
            border-radius: 12px;
            padding: 10px 12px;
            margin-bottom: 6px;
            border-left: 3px solid var(--blue);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.15s ease;
            gap: 8px;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }

        .ios-event-item:active {
            transform: scale(0.98);
            background: var(--surface-3);
        }

        .ios-event-item.completed {
            background: rgba(52, 199, 89, 0.08);
            opacity: 0.75;
            border-left-color: var(--green);
        }

        body.dark .ios-event-item.completed {

<body>
    <div id="app">
        <div id="loading" style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:20px;background:var(--bg);">
            <div style="width:36px;height:36px;border:3px solid rgba(0,122,255,0.15);border-top-color:#007AFF;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
            <span style="color:#8e8e93;font-size:16px;font-weight:500;">Carregando...</span>
        </div>
        <style>
            @keyframes spin { to { transform: rotate(360deg); } }
        </style>
    </div>
    <div class="toast-container" id="toast-container"></div>

    <script>
        // ============================================
        // CONFIGURAÇÃO
        // ============================================
        const GOOGLE_SHEETS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwms4JavFxbp1XMvW-XCLzZNTN4srw-tVtonzn9m7IiHApVNDIO-0SG_xEhcbAOtbhqfA/exec";
        const ADMIN_PASSWORD = "2026";

        // ============================================
        // ESTADO GLOBAL
        // ============================================
        let state = {
            activeTab: 'cidades',
            filter: 'all', // all | pending | done
            syncStatus: 'offline',
            isLoading: true,
            isDark: false,
            isUploadingPdf: false,
            isUploadingMedia: false,
            uploadProgress: 0,
            uploadStatus: '',
            uploadError: '',
            cidades: [],
            aniversariantes: [],
            datasComemorativas: [],
            isEditModalOpen: false,
            editingItem: null,
            editType: '',
            isImageUploadModalOpen: false,
            taskToComplete: null,
            taskTypeToComplete: '',
            tempImageBase64: '',
            tempFileName: '',
            viewMonth: new Date().getMonth(),
            viewYear: new Date().getFullYear(),
            selectedDay: new Date().getDate(),
            
            isAddModalOpen: false,
            newItem: { tipo: 'cidades', titulo: '', data: '', extra: '' },

            // password modal
            passwordModal: {
                isOpen: false,
                title: '',
                dots: 0,
                error: false,
                onSuccess: null
            }
        };

        let isSaving = false;
        let updateTimeout = null;
        const currentDate = new Date();
        const currentYear = currentDate.getFullYear();
        const currentMonth = currentDate.getMonth();
        const currentDay = currentDate.getDate();
        const monthNames = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
        const weekDays = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB'];

        // ============================================
        // TOAST
        // ============================================
        function showToast(message, type = 'success', duration = 3000) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️';
            toast.innerHTML = `<span>${icon}</span><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'toastOut 0.3s forwards';
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        // ============================================
        // DARK MODE
        // ============================================
        function applyDarkMode(isDark) {
            state.isDark = isDark;
            document.body.classList.toggle('dark', isDark);
            document.querySelector('meta[name="theme-color"]').setAttribute('content', isDark ? '#000000' : '#f2f2f7');
            try { localStorage.setItem('darkMode', isDark ? '1' : '0'); } catch(e) {}
        }

        window.toggleDarkMode = () => {
            applyDarkMode(!state.isDark);
            updateUI();
        };

        // ============================================
        // HELPERS
        // ============================================
        const isImageUrl = (url) => {
            if (!url || typeof url !== 'string') return false;
            return url.match(/\.(jpg|jpeg|png|gif|webp|bmp|svg)$/i) !== null ||
                   url.includes('lh3.googleusercontent.com') ||
                   url.includes('drive.google.com') ||
                   url.includes('googleusercontent.com');
        };

        const getDriveImageUrl = (url) => {
            if (!url) return '';
            if (url.includes('lh3.googleusercontent.com')) return url;
            const match = url.match(/\/d\/([^\/]+)/);
            if (match) return 'https://lh3.googleusercontent.com/d/' + match[1];
            const idMatch = url.match(/id=([^&]+)/);
            if (idMatch) return 'https://lh3.googleusercontent.com/d/' + idMatch[1];
            return url;
        };

        const formatIncomingDate = (dateStr, tabType) => {
            if (!dateStr) return "";
            const str = String(dateStr).trim();
            
            const isoMatch = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
            if (isoMatch) {
                const day = isoMatch[3];
                const month = isoMatch[2];
                if (tabType === 'aniversariantes') return `${day}/${month}`;
                else {
                    const meses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
                    return `${day} de ${meses[parseInt(month, 10) - 1]}`;
                }
            }
            
            const d = new Date(str);
            if (!isNaN(d.getTime()) && str.includes("GMT")) {
                const day = String(d.getDate()).padStart(2, '0');
                const month = String(d.getMonth() + 1).padStart(2, '0');
                if (tabType === 'aniversariantes') return `${day}/${month}`;
                else {
                    const meses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
                    return `${day} de ${meses[d.getMonth()]}`;
                }
            }
            
            return str;
        };

        const extractDayMonth = (dateString) => {
            if (!dateString) return null;
            const str = String(dateString).trim();
            
            const slashMatch = str.match(/^(\d{1,2})\/(\d{1,2})/);
            if (slashMatch) return { day: parseInt(slashMatch[1]), month: parseInt(slashMatch[2]) - 1 };
            
            const monthMap = {
                'janeiro': 0, 'fevereiro': 1, 'março': 2, 'abril': 3, 'maio': 4, 'junho': 5,
                'julho': 6, 'agosto': 7, 'setembro': 8, 'outubro': 9, 'novembro': 10, 'dezembro': 11,
                'jan': 0, 'fev': 1, 'mar': 2, 'abr': 3, 'mai': 4, 'jun': 5,
                'jul': 6, 'ago': 7, 'set': 8, 'out': 9, 'nov': 10, 'dez': 11
            };
            
            const monthMatch = str.match(/(\d{1,2})\s+de\s+([a-zA-ZçÇ]+)/i);
            if (monthMatch) {
                const day = parseInt(monthMatch[1]);
                const monthName = monthMatch[2].toLowerCase();
                if (monthMap[monthName] !== undefined) return { day, month: monthMap[monthName] };
            }
            
            const isoMatch = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
            if (isoMatch) return { day: parseInt(isoMatch[3]), month: parseInt(isoMatch[2]) - 1 };
            
            const dateObj = new Date(str);
            if (!isNaN(dateObj.getTime())) return { day: dateObj.getDate(), month: dateObj.getMonth() };
            
            return null;
        };

        const isEventOnDay = (dateString, day, month) => {
            const parsed = extractDayMonth(dateString);
            if (!parsed) return false;
            return parsed.day === day && parsed.month === month;
        };

        const getEventsForDay = (day, month, year) => {
            let events = [];
            const activeTab = state.activeTab;
            
            if (activeTab === 'cidades' || activeTab === 'all') {
                events = events.concat(state.cidades.filter(c => isEventOnDay(c.data, day, month)).map(c => ({ ...c, type: 'cidades' })));
            }
            if (activeTab === 'aniversariantes' || activeTab === 'all') {
                events = events.concat(state.aniversariantes.filter(a => isEventOnDay(a.data, day, month)).map(a => ({ ...a, type: 'aniversariantes' })));
            }
            if (activeTab === 'datas' || activeTab === 'all') {
                events = events.concat(state.datasComemorativas.filter(d => isEventOnDay(d.data, day, month)).map(d => ({ ...d, type: 'datas' })));
            }
            return events;
        };

        const getEventsForMonth = (month, year) => {
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            let allEvents = [];
            for (let d = 1; d <= daysInMonth; d++) {
                allEvents = allEvents.concat(getEventsForDay(d, month, year));
            }
            return allEvents;
        };

        const hasEventOnDay = (day, month, year) => {
            return getEventsForDay(day, month, year).length > 0;
        };

        const allEventsCompletedOnDay = (day, month, year) => {
            const events = getEventsForDay(day, month, year);
            if (events.length === 0) return false;
            return events.every(e => e.arteFeita === true);
        };

        const hasPendingOnDay = (day, month, year) => {
            const events = getEventsForDay(day, month, year);
            if (events.length === 0) return false;
            return events.some(e => !e.arteFeita);
        };

        const getEventTypesOnDay = (day, month, year) => {
            const events = getEventsForDay(day, month, year);
            const types = events.map(e => e.type);
            return [...new Set(types)].slice(0, 3);
        };

        const dayHasFilteredEvents = (day, month, year) => {
            const events = getEventsForDay(day, month, year);
            if (events.length === 0) return false;
            if (state.filter === 'pending') return events.some(e => !e.arteFeita);
            if (state.filter === 'done') return events.some(e => e.arteFeita);
            return true;
        };

        // Apply filter to an array of events

            else if (state.activeTab === 'aniversariantes') all = state.aniversariantes.map(a => ({...a, type:'aniversariantes'}));
            else if (state.activeTab === 'datas') all = state.datasComemorativas.map(d => ({...d, type:'datas'}));
            return all;
        };

        // Get next upcoming event (from today forward)
        const getNextEvent = () => {
            const all = getAllEventsOfActiveTab();
            const today = new Date();
            today.setHours(0,0,0,0);
            
            let best = null;
            let bestDiff = Infinity;
            
            all.forEach(ev => {
                const parsed = extractDayMonth(ev.data);
                if (!parsed) return;
                let evDate = new Date(today.getFullYear(), parsed.month, parsed.day);
                if (evDate < today) evDate = new Date(today.getFullYear() + 1, parsed.month, parsed.day);
                const diff = Math.ceil((evDate - today) / (1000 * 60 * 60 * 24));
                if (diff < bestDiff) {
                    bestDiff = diff;
                    best = { ...ev, diff };
                }
            });
            
            return best;
        };

        const handleImageCompression = (file, callback) => {
            if (!file) return;
            
            const fileSize = file.size;
            const maxSize = 1024 * 1024 * 1024;
            
            if (fileSize > maxSize) {
                alert(`O arquivo é muito grande (${(fileSize / 1024 / 1024 / 1024).toFixed(2)}GB). O limite é 1GB.`);
                return;
            }
            
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    
                    const MAX_WIDTH = 2000;
                    if (width > MAX_WIDTH) {
                        height = height * (MAX_WIDTH / width);
                        width = MAX_WIDTH;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const base64 = canvas.toDataURL('image/jpeg', 0.85);
                    callback(base64, file.name);
                };
                reader.onerror = function() {
                    const base64 = event.target.result;
                    callback(base64, file.name);
                };
            };
        };

        // ============================================

        const processPdfText = (text) => {
            const upperText = text.toUpperCase();
            let category = null;
            if (upperText.includes("ANIVERSÁRIO DAS CIDADES") || upperText.includes("CIDADES")) category = "cidades";
            else if (upperText.includes("DATAS COMEMORATIVAS")) category = "datas";
            else if (upperText.includes("NOME ASSESSOR") || upperText.includes("ASSESSOR")) category = "aniversariantes";
            if (!category) return alert("Não foi possível identificar a categoria.");

            const newItems = [];
            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            const isIgnored = (str) => /^(DATA|CIDADE|COMEMORAÇÃO|NOME ASSESSOR|CHICO GUARNIERI|DEPUTADO|AGENDA|ANIVERSÁRIO|DATAS|PAGE|FOLHA|---)/i.test(str) || str.length <= 2;

            const pushItem = (cat, arr, date, desc) => {
                desc = desc.trim();
                if (!desc || desc.length < 2) return;
                const id = Date.now() + Math.random();
                if (cat === 'cidades') arr.push({ id, data: date, cidade: desc, anoFundacao: null, arteFeita: false, imagem: "" });
                else if (cat === 'datas') arr.push({ id, data: date, comemoracao: desc, arteFeita: false, imagem: "" });
                else arr.push({ id, data: date, nome: desc, arteFeita: false, imagem: "" });
            };

            if (category === "cidades" || category === "datas") {
                const dateRegex = /^.*?(\d{1,2}\s+de\s+[a-zA-ZçÇ]+)\s*(.*)$/i;
                let currentDateVal = null, currentDesc = "";
                for (const line of lines) {
                    let cleanLine = line.replace(/^[,;'"\-]+|[,;'"\-]+$/g, '').trim();
                    if (!cleanLine || isIgnored(cleanLine)) continue;
                    const match = cleanLine.match(dateRegex);
                    if (match) {
                        if (currentDateVal && currentDesc) pushItem(category, newItems, currentDateVal, currentDesc);
                        currentDateVal = match[1].trim();
                        currentDesc = match[2].replace(/^[,;'"\-\s]+/, '').trim();
                    } else if (currentDateVal) {
                        currentDesc += (currentDesc ? " " : "") + cleanLine;
                    }
                }
                if (currentDateVal && currentDesc) pushItem(category, newItems, currentDateVal, currentDesc);
            } else if (category === "aniversariantes") {
                const dateRegex = /^.*?(\d{2}\/\d{2})\s*(.*)$/i;
                let currentDateVal = null, currentDesc = "";
                for (const line of lines) {
                    let cleanLine = line.replace(/^[,;'"\-]+|[,;'"\-]+$/g, '').trim();
                    if (!cleanLine || isIgnored(cleanLine)) continue;
                    const match = cleanLine.match(dateRegex);
                    if (match) {
                        if (currentDateVal && currentDesc) pushItem(category, newItems, currentDateVal, currentDesc);
                        currentDateVal = match[1].trim();
                        currentDesc = match[2].replace(/^[,;'"\-\s]+/, '').trim();
                    } else if (currentDateVal) {
                        currentDesc += (currentDesc ? " " : "") + cleanLine;
                    }
                }
                if (currentDateVal && currentDesc) pushItem(category, newItems, currentDateVal, currentDesc);
            }

            if (newItems.length > 0) {
                if (confirm(`Encontrados ${newItems.length} novos itens. Salvar?`)) {
                    syncBatchToSheets(category, newItems);
                }
            } else {
                alert("Nenhum dado válido encontrado.");
            }
        };

                                                        </div>
                                                    `;
                                                })()}
                                            </div>
                                            
                                            <div class="ios-btn-group" style="margin-top:12px;">
                                                ${(() => {
                                                    const mediaUrl = state.editingItem?.imagem || '';
                                                    if (mediaUrl && mediaUrl.length > 10) {
                                                        const imageUrl = getDriveImageUrl(mediaUrl);
                                                        return `<a href="${imageUrl}" target="_blank" rel="noreferrer" download="Arte_${state.editingItem.id}.jpg" class="ios-btn secondary" style="text-align:center;padding:10px;font-size:14px;text-decoration:none;">Baixar Imagem</a>`;
                                                    }
                                                    return `<button disabled class="ios-btn" style="background:var(--surface-3);color:var(--text-2);text-align:center;padding:10px;font-size:14px;cursor:not-allowed;">Baixar Imagem</button>`;
                                                })()}
                                                
                                                <button onclick="handleEditImageClick()" class="ios-btn secondary" style="text-align:center;padding:10px;font-size:14px;">
                                                    ${(state.editingItem?.imagem && state.editingItem.imagem.length > 10) ? 'Alterar Imagem' : 'Adicionar Imagem'}
                                                </button>
                                                <input type="file" id="edit-image-input" accept="image/*" style="display:none;" onchange="handleEditImageSelect(event)" />
                                            </div>
                                        </div>
                                    ` : ''}
                                </div>

                                <hr class="ios-divider" />
                                <div class="ios-btn-group">
                                    <button onclick="closeEditModal()" class="ios-btn secondary">Cancelar</button>
                                    <button onclick="handleSaveEdit()" class="ios-btn primary">Salvar</button>
                                </div>
                            </div>
                        </div>
                    ` : ''}

                    <!-- MODAL - PASSWORD -->
                    ${state.passwordModal.isOpen ? `
                        <div class="ios-modal" onclick="if(event.target === this) closePasswordModal()">
                            <div class="ios-modal-content" style="max-width:380px;">
                                <div class="ios-modal-handle"></div>
                                <h2>🔒 Senha</h2>
                                <p class="subtitle">${state.passwordModal.title}</p>
                                
                                <div class="password-dots">
                                    ${[0,1,2,3].map(i => `<div class="password-dot ${i < state.passwordModal.dots ? 'filled' : ''} ${state.passwordModal.error ? 'error' : ''}"></div>`).join('')}
                                </div>

                                <div class="password-pad">
                                    ${[1,2,3,4,5,6,7,8,9].map(n => `<button onclick="handlePwdDigit('${n}')">${n}</button>`).join('')}
                                    <button onclick="closePasswordModal()" style="font-size:14px;color:var(--red);">✕</button>
                                    <button onclick="handlePwdDigit('0')">0</button>
                                    <button onclick="handlePwdBackspace()" style="font-size:18px;">⌫</button>
                                </div>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;

            return html;
        };

        // ============================================
        // UPDATE UI
        // ============================================
        const updateUI = () => {
            const app = document.getElementById('app');
            app.innerHTML = renderApp();
        };

        // ============================================
        // GLOBAL HANDLERS
        // ============================================
        window.setActiveTab = (tab) => {
            state.activeTab = tab;
            updateUI();
        };

        window.setFilter = (f) => {
            state.filter = f;
            updateUI();
        };

        window.changeMonth = (delta) => {
            let newMonth = state.viewMonth + delta;
            let newYear = state.viewYear;
            if (newMonth > 11) { newMonth = 0; newYear++; }
            if (newMonth < 0) { newMonth = 11; newYear--; }
            state.viewMonth = newMonth;
            state.viewYear = newYear;
            const daysInMonth = new Date(newYear, newMonth + 1, 0).getDate();
            if (state.selectedDay > daysInMonth) state.selectedDay = daysInMonth;
            updateUI();
        };

        window.selectDay = (day) => {
            state.selectedDay = day;
            updateUI();
        };

        window.openAddModal = () => {
            state.isAddModalOpen = true;
            state.newItem = { 
                tipo: state.activeTab === 'all' ? 'cidades' : state.activeTab, 
                titulo: '', 
                data: '', 
                extra: '' 
            };
            updateUI();
        };
        
        window.openAddModalAtDate = (day) => {
            state.selectedDay = day;
            state.isAddModalOpen = true;
            state.newItem = { 
                tipo: state.activeTab === 'all' ? 'cidades' : state.activeTab, 
                titulo: '', 
                data: `${String(day).padStart(2, '0')}/${String(state.viewMonth + 1).padStart(2, '0')}`, 
                extra: '' 
            };
            updateUI();
        };

        window.closeAddModal = () => {
            state.isAddModalOpen = false;
            updateUI();
        };

        window.updateNewItem = (field, value) => {
            state.newItem[field] = value;
            updateUI();
        };

        window.handleSaveNewEvent = () => {
            if (!state.newItem.titulo || !state.newItem.data) {
                showToast('Preencha o nome e a data', 'error');
                return;
            }

            const id = Date.now() + Math.random();
            let itemToAdd = null;

            if (state.newItem.tipo === 'cidades') {
                itemToAdd = { id, data: state.newItem.data, cidade: state.newItem.titulo, anoFundacao: state.newItem.extra || null, arteFeita: false, imagem: "" };
            } else if (state.newItem.tipo === 'aniversariantes') {
                itemToAdd = { id, data: state.newItem.data, nome: state.newItem.titulo, arteFeita: false, imagem: "" };
            } else if (state.newItem.tipo === 'datas') {
                itemToAdd = { id, data: state.newItem.data, comemoracao: state.newItem.titulo, arteFeita: false, imagem: "" };
            }

            if (itemToAdd) {
                syncBatchToSheets(state.newItem.tipo, [itemToAdd]);
                closeAddModal();
            }
        };

        window.handleImageSelect = (event) => {
            if (event.target.files && event.target.files[0]) {
                const file = event.target.files[0];
                state.uploadError = '';
                state.tempFileName = file.name;
                state.tempImageBase64 = 'loading';
                updateUI();
                handleImageCompression(file, (base64, fileName) => {
                    state.tempImageBase64 = base64;
                    state.tempFileName = fileName || '';
                    updateUI();
                });
            }
            event.target.value = '';
        };

        window.closeImageModal = () => {
            if (state.isUploadingMedia) {
                if (!confirm("O upload está em andamento. Cancelar?")) return;
            }
            state.isImageUploadModalOpen = false;
            state.taskToComplete = null;
            state.taskTypeToComplete = '';
            state.tempImageBase64 = '';
            state.tempFileName = '';
            state.uploadProgress = 0;
            state.uploadStatus = '';
            state.uploadError = '';
            state.isUploadingMedia = false;
            updateUI();
        };

        window.closeEditModal = () => {
            state.isEditModalOpen = false;
            state.editingItem = null;
            state.editType = '';
            updateUI();
        };

        window.updateEditingItem = (field, value) => {
            if (state.editingItem) state.editingItem[field] = value;
        };

        window.handleEditImageClick = () => {
            const isEditing = (state.editingItem?.imagem && state.editingItem.imagem.length > 10);
            openPasswordModal(`Digite a senha para ${isEditing ? 'alterar' : 'adicionar'} a imagem`, () => {
                document.getElementById('edit-image-input').click();
            });
        };

        window.handleEditImageSelect = (event) => {
            if (event.target.files && event.target.files[0]) {
                const file = event.target.files[0];
                state.editingItem.fileName = file.name;
                updateUI();
                handleImageCompression(file, (base64, fileName) => {
                    state.editingItem.imagem = base64;
                    state.editingItem.fileName = fileName || '';
                    updateUI();
                });
            }
            event.target.value = '';
        };

        // keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // ignore when typing in input/select/textarea
            const tag = (e.target.tagName || '').toLowerCase();
            if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
            
            if (state.passwordModal.isOpen) {
                if (e.key >= '0' && e.key <= '9') {
                    window.handlePwdDigit(e.key);
                    e.preventDefault();
                } else if (e.key === 'Backspace') {
                    window.handlePwdBackspace();
                    e.preventDefault();
                } else if (e.key === 'Escape') {
                    closePasswordModal();
                }
                return;
            }

            if (e.key === 'Escape') {
                if (state.isAddModalOpen) closeAddModal();
                else if (state.isImageUploadModalOpen) closeImageModal();
                else if (state.isEditModalOpen) closeEditModal();
                return;
            }

            // shortcuts only when no modal is open
            const anyModal = state.isAddModalOpen || state.isImageUploadModalOpen || state.isEditModalOpen;
            if (anyModal) return;

            if (e.key === 'n' || e.key === 'N') {
                window.openAddModal();
                e.preventDefault();
            } else if (e.key === 'ArrowLeft') {
                window.selectDay(Math.max(1, state.selectedDay - 1));
                e.preventDefault();
            } else if (e.key === 'ArrowRight') {
                const dim = new Date(state.viewYear, state.viewMonth + 1, 0).getDate();
                window.selectDay(Math.min(dim, state.selectedDay + 1));
                e.preventDefault();
            }
        });

        // ============================================
        // INIT
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            // dark mode persistence
            try {
                const saved = localStorage.getItem('darkMode');
                if (saved === '1' || (saved === null && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    applyDarkMode(true);
                }
            } catch(e) {}

            document.getElementById('loading').style.display = 'none';
            fetchDataFromSheets();
            setInterval(() => {
                const isModalOpen = state.isEditModalOpen || state.isImageUploadModalOpen || state.isAddModalOpen || state.passwordModal.isOpen;
                if (!isSaving && !isModalOpen) {
                    fetchDataFromSheets(true);
                }
            }, 15000);
        });
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister();
                }
            });
        }
    </script>
</body>
</html>
